<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Upload Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="stat"><b id="money">0</b><small>Crédits</small></div>
  <div class="stat sm"><b id="rate">0</b><small>par seconde</small></div>
  <div class="sp"></div>
  <button id="bOc">Overclock</button>
  <button id="bAuto">Auto</button>
  <button id="bSel">Sélection</button>
  <button id="bBp">Schémas</button>
  <button id="bMenu">Menu</button>
</div>
<div id="obj"></div>
<div id="hint"></div>
<div id="ctr"></div>
<canvas id="mini" width="300" height="190"></canvas>
<div class="box" id="sel"></div>
<div class="box" id="side">
  <button id="sideX" aria-label="Fermer">&times;</button>
  <div id="tabs"></div>
  <div id="subs"></div>
  <div id="tabBody"></div>
</div>
<div id="shop"></div>
<div id="toast"></div>
<div id="dlg"><div class="box2"><p id="dlgMsg"></p><div class="row"><button id="dlgNo">Annuler</button><button id="dlgYes" class="glow">Confirmer</button></div></div></div>
<button id="gold" title="Fichier doré !">+</button>
<script src="game.js"></script>
</body>
</html>
