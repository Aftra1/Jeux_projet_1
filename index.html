<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Upload Lab</title>
<style>
  :root{--bg:#0b0f17;--panel:#141b28;--panel2:#1b2436;--line:#2a3550;--txt:#e6ecf8;--dim:#8794b3;--acc:#4fd1c5;--gold:#f6c453;--bad:#ff6b6b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #top{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:8px 12px;background:linear-gradient(#0b0f17ee,#0b0f1700);pointer-events:none;flex-wrap:wrap}
  #top>*{pointer-events:auto}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
  .stat b{font-size:20px;color:var(--gold)} .stat small{display:block;color:var(--dim);font-size:11px}
  #top .sp{flex:1;pointer-events:none}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--acc)}
  button:disabled{opacity:.45;cursor:not-allowed}
  #shop{position:absolute;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px 12px;background:linear-gradient(#0b0f1700,#0b0f17f0 40%);overflow-x:auto}
  #shop button{min-width:128px;text-align:left;flex:0 0 auto}
  #shop button b{display:block}
  #shop button small{color:var(--dim)}
  #shop button .c{color:var(--gold)}
  .box{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:270px;box-shadow:0 8px 30px #0008}
  #sel{right:12px;top:70px;display:none}
  #glob{left:12px;top:70px;display:none}
  .box h3{margin:0 0 6px;font-size:15px}
  .box p{margin:4px 0 8px;color:var(--dim);font-size:12.5px}
  .box .row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .box button{flex:1}
  .up{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
  .up button{flex:0 0 auto}
  #hint{position:absolute;left:50%;transform:translateX(-50%);top:70px;background:var(--panel);border:1px solid var(--acc);border-radius:10px;padding:8px 14px;font-size:13px;max-width:90vw;text-align:center}
  #toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="stat"><b id="money">0</b><small>Crédits</small></div>
  <div class="stat"><b id="rate">0</b><small>Crédits / seconde</small></div>
  <div class="stat"><b id="files">0</b><small>Fichiers uploadés</small></div>
  <div class="sp"></div>
  <button id="bGlob">⚙ Améliorations</button>
  <button id="bReset">↺ Reset</button>
</div>
<div id="hint">Glisse depuis le port <b>●</b> de sortie d'un nœud vers le port d'entrée d'un autre pour les relier. Relie la Source à l'Upload !</div>
<div class="box" id="sel"></div>
<div class="box" id="glob"></div>
<div id="shop"></div>
<div id="toast"></div>

<script>
'use strict';
// ───────────────────────── Définitions ─────────────────────────
const NW = 150, NH = 64;
const DEFS = {
  source:  {name:'Source',      icon:'📁', ins:0, outs:1, cost:15,   t:2.0, desc:'Génère un fichier de valeur 1 à intervalle régulier.'},
  upload:  {name:'Upload',      icon:'☁️', ins:1, outs:0, cost:20,   t:0.6, desc:'Envoie les fichiers vers le cloud et rapporte des crédits.'},
  split:   {name:'Diviseur',    icon:'🔀', ins:1, outs:2, cost:60,   t:0.2, desc:'Répartit les fichiers sur deux sorties, en alternance.'},
  compress:{name:'Compresseur', icon:'🗜️', ins:1, outs:1, cost:40,   t:1.5, mult:2,   desc:'Double la valeur d\'un fichier.'},
  merge:   {name:'Fusion',      icon:'🧩', ins:2, outs:1, cost:140,  t:1.0, desc:'Fusionne 2 fichiers en un seul : (a + b) × 1,3.'},
  encrypt: {name:'Chiffreur',   icon:'🔒', ins:1, outs:1, cost:300,  t:3.0, mult:3,   desc:'Triple la valeur d\'un fichier.'},
  ai:      {name:'Analyseur IA',icon:'🧠', ins:1, outs:1, cost:2000, t:7.0, mult:8,   desc:'Multiplie la valeur par 8. Lent mais puissant.'},
};
const ORDER = ['source','upload','compress','split','merge','encrypt','ai'];
const COLORS = {source:'#4fd1c5',upload:'#f6c453',split:'#9f7aea',compress:'#63b3ed',merge:'#f687b3',encrypt:'#68d391',ai:'#fc8181'};

const GLOBALS = [
  {id:'rev',  name:'Marketing',        desc:'+25 % de revenus par upload', base:100,  grow:2.2, max:50},
  {id:'spd',  name:'Fibre optique',    desc:'+10 % de vitesse partout',    base:250,  grow:2.5, max:30},
  {id:'seed', name:'Meilleurs capteurs',desc:'+1 valeur de départ des Sources', base:500, grow:3.0, max:30},
  {id:'buf',  name:'Mémoire tampon',   desc:'+1 capacité des files d\'attente', base:400, grow:2.4, max:6},
];

// ───────────────────────── État ─────────────────────────
let G = null;
function newGame(){
  const g = {money:60, files:0, nextId:1, nodes:[], links:[], glob:{rev:0,spd:0,seed:0,buf:0}, bought:{}, view:{x:0,y:0,k:1}};
  G = g;
  addNode('source', -260, -40, true);
  addNode('upload', 160, -40, true);
}
function addNode(type,x,y,free){
  const n = {id:G.nextId++, type, x, y, level:0, inb:[], work:null, outq:[], rr:0, timer:0};
  for(let i=0;i<DEFS[type].ins;i++) n.inb.push([]);
  G.nodes.push(n);
  if(!free) G.bought[type] = (G.bought[type]||0)+1;
  return n;
}
const nodeById = id => G.nodes.find(n=>n.id===id);
const buyCost = type => Math.ceil(DEFS[type].cost * Math.pow(1.18, G.bought[type]||0));
const upCost = n => Math.ceil(DEFS[n.type].cost * 0.8 * Math.pow(1.65, n.level) + 10);
const gUpCost = d => Math.ceil(d.base * Math.pow(d.grow, G.glob[d.id]));
const speedOf = n => (1 + 0.3*n.level) * (1 + 0.1*G.glob.spd);
const timeOf = n => DEFS[n.type].t / speedOf(n);
const bufCap = () => 3 + G.glob.buf;
const revMult = () => 1 + 0.25*G.glob.rev;

// ───────────────────────── Géométrie ─────────────────────────
function inPort(n,i){ const c=DEFS[n.type].ins;  return {x:n.x,      y:n.y + NH*(i+1)/(c+1)}; }
function outPort(n,i){ const c=DEFS[n.type].outs; return {x:n.x+NW,   y:n.y + NH*(i+1)/(c+1)}; }
function ctrl(a,b){ const d=Math.max(60,Math.abs(b.x-a.x)/2); return [a, {x:a.x+d,y:a.y}, {x:b.x-d,y:b.y}, b]; }
function bez(p,t){ const u=1-t; return {
  x:u*u*u*p[0].x+3*u*u*t*p[1].x+3*u*t*t*p[2].x+t*t*t*p[3].x,
  y:u*u*u*p[0].y+3*u*u*t*p[1].y+3*u*t*t*p[2].y+t*t*t*p[3].y}; }
function linkPts(l){ return ctrl(outPort(nodeById(l.a),l.ao), inPort(nodeById(l.b),l.bi)); }

// ───────────────────────── Simulation ─────────────────────────
let income = [];  // [{t,v}]
function earn(v){ G.money += v; income.push({t:performance.now(), v}); }

function trySend(n){
  if(!n.outq.length) return;
  const def = DEFS[n.type];
  const order = def.outs===2 ? [n.rr%2, (n.rr+1)%2] : [0];
  for(const o of order){
    const l = G.links.find(l=>l.a===n.id && l.ao===o);
    if(!l) continue;
    const last = l.packets[l.packets.length-1];
    if(!last || last.t > 0.18){
      l.packets.push({v:n.outq.shift(), t:0});
      if(def.outs===2) n.rr = o+1;
      return;
    }
  }
}

function updateNode(n,dt){
  const def = DEFS[n.type], t = timeOf(n);
  if(n.type==='source'){
    if(n.outq.length<2){
      n.timer += dt;
      if(n.timer>=t){ n.timer=0; n.outq.push(1 + G.glob.seed); }
    }
  } else if(n.type==='upload'){
    if(!n.work && n.inb[0].length) n.work = {v:n.inb[0].shift(), rem:t};
    if(n.work){ n.work.rem -= dt; if(n.work.rem<=0){ earn(n.work.v*revMult()); G.files++; n.work=null; } }
  } else if(n.type==='merge'){
    if(!n.work && n.outq.length<2 && n.inb[0].length && n.inb[1].length)
      n.work = {v:(n.inb[0].shift()+n.inb[1].shift())*1.3, rem:t};
    if(n.work){ n.work.rem -= dt; if(n.work.rem<=0){ n.outq.push(n.work.v); n.work=null; } }
  } else {
    if(!n.work && n.outq.length<2 && n.inb[0].length)
      n.work = {v:n.inb[0].shift()*(def.mult||1), rem:t};
    if(n.work){ n.work.rem -= dt; if(n.work.rem<=0){ n.outq.push(n.work.v); n.work=null; } }
  }
  trySend(n);
}

function updateLinks(dt){
  for(const l of G.links){
    const b = nodeById(l.b);
    for(let i=0;i<l.packets.length;i++){
      const p = l.packets[i];
      const lim = i===0 ? 1 : l.packets[i-1].t - 0.12;
      p.t = Math.min(lim, p.t + dt/1.1);
    }
    const f = l.packets[0];
    if(f && f.t>=1 && b.inb[l.bi].length < bufCap()){ b.inb[l.bi].push(f.v); l.packets.shift(); }
  }
}

function step(dt){
  updateLinks(dt);
  for(const n of G.nodes) updateNode(n,dt);
}

// ───────────────────────── Rendu ─────────────────────────
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=window.devicePixelRatio||1; W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; }
addEventListener('resize',resize); resize();

const toWorld = (sx,sy)=>({x:(sx-W/2-G.view.x)/G.view.k, y:(sy-H/2-G.view.y)/G.view.k});
const toScreen = (wx,wy)=>({x:wx*G.view.k+W/2+G.view.x, y:wy*G.view.k+H/2+G.view.y});

function fmt(v){
  if(v<1000) return v<10 ? v.toFixed(1).replace(/\.0$/,'') : Math.floor(v).toString();
  const u=['K','M','B','T','Qa','Qi'];
  let i=-1; while(v>=1000 && i<u.length-1){ v/=1000; i++; }
  return v.toFixed(v<10?2:v<100?1:0)+u[i];
}

function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

let sel = null, drag = null, hoverPort = null;

function draw(){
  const v = G.view;
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.clearRect(0,0,W,H);
  // grille
  const gs = 40*v.k;
  cx.strokeStyle='#141c2c'; cx.lineWidth=1; cx.beginPath();
  const ox = ((W/2+v.x)%gs+gs)%gs, oy = ((H/2+v.y)%gs+gs)%gs;
  for(let x=ox;x<W;x+=gs){ cx.moveTo(x,0); cx.lineTo(x,H); }
  for(let y=oy;y<H;y+=gs){ cx.moveTo(0,y); cx.lineTo(W,y); }
  cx.stroke();

  cx.save();
  cx.translate(W/2+v.x, H/2+v.y); cx.scale(v.k,v.k);

  // liens
  for(const l of G.links){
    const p = linkPts(l);
    cx.strokeStyle = '#2f3d5e'; cx.lineWidth = 4;
    cx.beginPath(); cx.moveTo(p[0].x,p[0].y); cx.bezierCurveTo(p[1].x,p[1].y,p[2].x,p[2].y,p[3].x,p[3].y); cx.stroke();
    for(const k of l.packets){
      const q = bez(p,k.t);
      cx.fillStyle = k.v>=1000?'#fc8181':k.v>=50?'#f6c453':'#4fd1c5';
      rr(q.x-6,q.y-6,12,12,3); cx.fill();
    }
  }
  if(drag && drag.kind==='link'){
    const a = outPort(nodeById(drag.n), drag.o), b = drag.pos;
    const p = ctrl(a,b);
    cx.strokeStyle='#4fd1c5'; cx.setLineDash([6,4]); cx.lineWidth=3;
    cx.beginPath(); cx.moveTo(p[0].x,p[0].y); cx.bezierCurveTo(p[1].x,p[1].y,p[2].x,p[2].y,p[3].x,p[3].y); cx.stroke(); cx.setLineDash([]);
  }

  // nœuds
  for(const n of G.nodes){
    const d = DEFS[n.type], col = COLORS[n.type];
    cx.shadowColor='#000a'; cx.shadowBlur=12;
    cx.fillStyle='#172033'; rr(n.x,n.y,NW,NH,10); cx.fill();
    cx.shadowBlur=0;
    cx.strokeStyle = sel===n.id ? '#fff' : col; cx.lineWidth = sel===n.id?3:2; rr(n.x,n.y,NW,NH,10); cx.stroke();
    // progression
    if(n.work && n.work.rem!==undefined){
      const pr = 1 - n.work.rem/timeOf(n);
      cx.fillStyle = col+'55'; rr(n.x+4,n.y+NH-9,(NW-8)*Math.max(0,Math.min(1,pr)),5,2); cx.fill();
    } else if(n.type==='source'){
      cx.fillStyle = col+'55'; rr(n.x+4,n.y+NH-9,(NW-8)*Math.min(1,n.timer/timeOf(n)),5,2); cx.fill();
    }
    cx.fillStyle='#e6ecf8'; cx.font='600 13px system-ui'; cx.textAlign='left'; cx.textBaseline='middle';
    cx.fillText(d.icon+' '+d.name, n.x+12, n.y+20);
    cx.fillStyle='#8794b3'; cx.font='11px system-ui';
    const buf = n.inb.reduce((s,q)=>s+q.length,0);
    cx.fillText('Niv. '+(n.level+1)+(d.ins?'  ·  file '+buf+'/'+bufCap():''), n.x+12, n.y+40);
    // ports
    for(let i=0;i<d.ins;i++){ const p=inPort(n,i); port(p, hoverPort&&hoverPort.in&&hoverPort.n===n.id&&hoverPort.i===i, false); }
    for(let i=0;i<d.outs;i++){ const p=outPort(n,i); port(p, hoverPort&&!hoverPort.in&&hoverPort.n===n.id&&hoverPort.i===i, true, col); }
  }
  cx.restore();
}
function port(p,hot,out,col){
  cx.beginPath(); cx.arc(p.x,p.y,hot?9:7,0,Math.PI*2);
  cx.fillStyle = out ? (col||'#4fd1c5') : '#0b0f17'; cx.fill();
  cx.strokeStyle = hot ? '#fff' : (out ? '#0b0f17' : '#8794b3'); cx.lineWidth=2; cx.stroke();
}

// ───────────────────────── Interactions ─────────────────────────
function findPort(w){
  const r = 14/G.view.k;
  for(const n of G.nodes){
    const d = DEFS[n.type];
    for(let i=0;i<d.outs;i++){ const p=outPort(n,i); if(Math.hypot(p.x-w.x,p.y-w.y)<r) return {in:false,n:n.id,i}; }
    for(let i=0;i<d.ins;i++){ const p=inPort(n,i);  if(Math.hypot(p.x-w.x,p.y-w.y)<r) return {in:true, n:n.id,i}; }
  }
  return null;
}
function findNode(w){
  for(let i=G.nodes.length-1;i>=0;i--){
    const n=G.nodes[i];
    if(w.x>=n.x && w.x<=n.x+NW && w.y>=n.y && w.y<=n.y+NH) return n;
  }
  return null;
}
function findLink(w){
  const r = 10/G.view.k;
  for(const l of G.links){
    const p = linkPts(l);
    for(let t=0;t<=1;t+=0.04){ const q=bez(p,t); if(Math.hypot(q.x-w.x,q.y-w.y)<r) return l; }
  }
  return null;
}
function connect(a,ao,b,bi){
  if(a===b) return;
  G.links = G.links.filter(l=>!(l.a===a&&l.ao===ao) && !(l.b===b&&l.bi===bi));
  G.links.push({a,ao,b,bi,packets:[]});
}
function removeNode(n){
  G.links = G.links.filter(l=>l.a!==n.id && l.b!==n.id);
  G.nodes = G.nodes.filter(x=>x!==n);
}

cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  const w = toWorld(e.clientX,e.clientY);
  const pt = findPort(w);
  if(pt && !pt.in){ drag={kind:'link',n:pt.n,o:pt.i,pos:w}; return; }
  if(pt && pt.in){ // déplacer un lien existant en le reprenant par son entrée
    const l = G.links.find(l=>l.b===pt.n && l.bi===pt.i);
    if(l){ G.links = G.links.filter(x=>x!==l); drag={kind:'link',n:l.a,o:l.ao,pos:w}; return; }
  }
  const n = findNode(w);
  if(n){
    sel = n.id; G.nodes.splice(G.nodes.indexOf(n),1); G.nodes.push(n);
    drag={kind:'node',n:n.id,dx:w.x-n.x,dy:w.y-n.y}; showSel(); return;
  }
  sel=null; showSel();
  drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:G.view.x,vy:G.view.y};
});
cv.addEventListener('pointermove', e=>{
  const w = toWorld(e.clientX,e.clientY);
  hoverPort = findPort(w);
  if(!drag) return;
  if(drag.kind==='link') drag.pos = w;
  else if(drag.kind==='node'){ const n=nodeById(drag.n); n.x=Math.round((w.x-drag.dx)/10)*10; n.y=Math.round((w.y-drag.dy)/10)*10; }
  else if(drag.kind==='pan'){ G.view.x=drag.vx+e.clientX-drag.sx; G.view.y=drag.vy+e.clientY-drag.sy; }
});
cv.addEventListener('pointerup', e=>{
  if(drag && drag.kind==='link'){
    const w = toWorld(e.clientX,e.clientY);
    let pt = findPort(w);
    if(!pt || !pt.in){ // tolérance : lâcher sur le nœud => premier port d'entrée libre
      const n = findNode(w);
      if(n){
        const c = DEFS[n.type].ins;
        let i = 0; for(; i<c; i++) if(!G.links.some(l=>l.b===n.id&&l.bi===i)) break;
        if(c) pt = {in:true,n:n.id,i:Math.min(i,c-1)};
      }
    }
    if(pt && pt.in) connect(drag.n,drag.o,pt.n,pt.i);
  }
  drag=null;
});
cv.addEventListener('dblclick', e=>{
  const l = findLink(toWorld(e.clientX,e.clientY));
  if(l) G.links = G.links.filter(x=>x!==l);
});
cv.addEventListener('contextmenu', e=>{
  e.preventDefault();
  const w = toWorld(e.clientX,e.clientY);
  const l = findLink(w); if(l) G.links = G.links.filter(x=>x!==l);
});
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const v=G.view, w=toWorld(e.clientX,e.clientY);
  v.k = Math.max(0.35, Math.min(2.2, v.k*(e.deltaY<0?1.1:1/1.1)));
  v.x = e.clientX - W/2 - w.x*v.k; v.y = e.clientY - H/2 - w.y*v.k;
},{passive:false});
addEventListener('keydown', e=>{
  if((e.key==='Delete'||e.key==='Backspace') && sel){ const n=nodeById(sel); if(n) sell(n); }
});

// ───────────────────────── UI ─────────────────────────
const $ = id => document.getElementById(id);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.opacity=0,1800); }

function buildShop(){
  $('shop').innerHTML = '';
  for(const type of ORDER){
    const d = DEFS[type], b = document.createElement('button');
    b.dataset.type = type;
    b.title = d.desc;
    b.innerHTML = `<b>${d.icon} ${d.name}</b><small>${d.desc.split('.')[0]}</small><br><span class="c"></span>`;
    b.onclick = ()=>{
      const c = buyCost(type);
      if(G.money<c){ toast('Pas assez de crédits'); return; }
      G.money -= c;
      const w = toWorld(W/2 + (Math.random()-.5)*160, H/2 + (Math.random()-.5)*160);
      const n = addNode(type, Math.round((w.x-NW/2)/10)*10, Math.round((w.y-NH/2)/10)*10);
      sel = n.id; showSel();
    };
    $('shop').appendChild(b);
  }
}
function refreshShop(){
  for(const b of $('shop').children){
    const c = buyCost(b.dataset.type);
    b.querySelector('.c').textContent = '💰 '+fmt(c);
    b.disabled = G.money < c;
  }
}
function sell(n){
  G.money += Math.floor(buyCost(n.type)*0.4);
  removeNode(n); sel=null; showSel();
}
function showSel(){
  const box = $('sel'), n = sel ? nodeById(sel) : null;
  if(!n){ box.style.display='none'; return; }
  const d = DEFS[n.type], c = upCost(n);
  const t = timeOf(n);
  let extra = '';
  if(n.type==='source') extra = `Produit 1 fichier de valeur ${1+G.glob.seed} toutes les ${t.toFixed(2)} s.`;
  else if(n.type==='upload') extra = `Envoie 1 fichier toutes les ${t.toFixed(2)} s (×${revMult().toFixed(2)} revenus).`;
  else extra = `Traitement : ${t.toFixed(2)} s par fichier.`;
  box.innerHTML = `<h3>${d.icon} ${d.name} — niveau ${n.level+1}</h3><p>${d.desc}</p><p>${extra}</p>
    <div class="row"><button id="bUp">⬆ Améliorer (+30 % vitesse)<br>💰 ${fmt(c)}</button></div>
    <div class="row"><button id="bDis">✂ Déconnecter</button><button id="bSell">🗑 Vendre (+${fmt(Math.floor(buyCost(n.type)*0.4))})</button></div>`;
  box.style.display='block';
  $('bUp').disabled = G.money<c;
  $('bUp').onclick = ()=>{ const c=upCost(n); if(G.money>=c){ G.money-=c; n.level++; showSel(); } };
  $('bDis').onclick = ()=>{ G.links = G.links.filter(l=>l.a!==n.id && l.b!==n.id); };
  $('bSell').onclick = ()=>sell(n);
}
function showGlob(){
  const box = $('glob');
  let h = '<h3>⚙ Améliorations globales</h3>';
  for(const g of GLOBALS){
    const lv = G.glob[g.id], max = lv>=g.max, c = gUpCost(g);
    h += `<div class="up"><div><b>${g.name}</b> <small>(${lv}/${g.max})</small><p style="margin:2px 0">${g.desc}</p></div>
      <button data-g="${g.id}" ${max||G.money<c?'disabled':''}>${max?'MAX':'💰 '+fmt(c)}</button></div>`;
  }
  box.innerHTML = h;
  box.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{
    const g = GLOBALS.find(x=>x.id===b.dataset.g), c = gUpCost(g);
    if(G.money>=c && G.glob[g.id]<g.max){ G.money-=c; G.glob[g.id]++; showGlob(); showSel(); }
  });
}
$('bGlob').onclick = ()=>{ const b=$('glob'); if(b.style.display==='block') b.style.display='none'; else { showGlob(); b.style.display='block'; } };
$('bReset').onclick = ()=>{ if(confirm('Tout recommencer à zéro ?')){ localStorage.removeItem('uploadlab'); newGame(); sel=null; showSel(); income=[]; } };

// ───────────────────────── Sauvegarde ─────────────────────────
function save(){
  try{
    const d = JSON.parse(JSON.stringify(G, (k,v)=> k==='packets' ? [] : v));
    localStorage.setItem('uploadlab', JSON.stringify(d));
  }catch(e){}
}
function load(){
  try{
    const s = localStorage.getItem('uploadlab'); if(!s) return false;
    const d = JSON.parse(s);
    if(!d.nodes || !d.nodes.length) return false;
    G = d; G.glob = Object.assign({rev:0,spd:0,seed:0,buf:0}, G.glob);
    for(const n of G.nodes){ n.inb = DEFS[n.type].ins ? Array.from({length:DEFS[n.type].ins},(_,i)=>n.inb[i]||[]) : []; }
    return true;
  }catch(e){ return false; }
}
setInterval(save, 5000);
addEventListener('beforeunload', save);

// ───────────────────────── Boucle ─────────────────────────
if(!load()) newGame();
buildShop();
let last = performance.now(), uiT = 0;
function loop(now){
  let dt = Math.min(0.25,(now-last)/1000); last = now;
  // sous-étapes pour rester stable
  const n = Math.max(1,Math.ceil(dt/0.05));
  for(let i=0;i<n;i++) step(dt/n);
  draw();
  uiT += dt;
  if(uiT>0.2){
    uiT=0;
    income = income.filter(e=>now-e.t<10000);
    const r = income.reduce((s,e)=>s+e.v,0)/10;
    $('money').textContent = fmt(G.money);
    $('rate').textContent = fmt(r);
    $('files').textContent = fmt(G.files);
    refreshShop();
    if($('sel').style.display==='block'){ const b=$('bUp'); const n=nodeById(sel); if(b&&n) b.disabled = G.money<upCost(n); }
    if(G.links.length) $('hint').style.display='none';
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// accès pour les tests
window.__game = {get G(){return G;}, connect, step, addNode};
</script>
