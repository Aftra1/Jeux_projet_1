<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Upload Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="stat"><b id="money">0</b><small>Crédits</small></div>
  <div class="stat"><b id="rate">0</b><small>par seconde</small></div>
  <div class="stat hide-sm"><b id="files">0</b><small>Fichiers uploadés</small></div>
  <div class="stat hide-sm"><b id="mult">×1</b><small>Multiplicateur</small></div>
  <div class="sp"></div>
  <button id="bOc">Overclock</button>
  <button id="bFit">Centrer</button>
  <button id="bUp">Améliorations</button>
  <button id="bQp">Quantique</button>
  <button id="bAch">Succès</button>
  <button id="bOpt">Options</button>
</div>
<div id="obj"></div>
<div id="hint"></div>
<canvas id="mini" width="300" height="190"></canvas>
<div class="box" id="sel"></div>
<div class="box" id="side">
  <div id="tabs"></div>
  <div id="tabBody"></div>
</div>
<div id="shop"></div>
<div id="toast"></div>
<button id="gold" title="Fichier doré !">+</button>
<script src="game.js"></script>
</body>
</html>
